name: CI - frontend-libroclases

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-build-and-analyze:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for SonarQube scanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests and coverage
        run: npm run test:coverage

      - name: Build app
        run: npm run build

      - name: Build NPM library
        run: npm run build:lib

      - name: Validate NPM package
        run: npm pack --dry-run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-libroclases
          path: coverage

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          PROJECT_KEY="${SONAR_PROJECT_KEY:-${GITHUB_REPOSITORY//\//_}}"
          HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
          npx --yes sonar-scanner \
            -Dsonar.host.url="$HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="src/**/*.test.js,src/**/*.test.jsx" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
